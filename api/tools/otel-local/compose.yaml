# Local telemetry backend for verifying api instrumentation (see api/docs/observability.md).
#
#   docker compose -f api/tools/otel-local/compose.yaml up -d
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 pnpm nx run api:serve
#
# Traces: Jaeger UI at http://localhost:16686. Metrics and logs: `docker compose ... logs collector`.
name: tiny-dash-otel

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports:
      - "16686:16686"
