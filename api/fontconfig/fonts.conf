<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Font rendering for the headless Chrome that screenshots the dashboard.
  Selected via FONTCONFIG_FILE (Dockerfile, tools/flatpak-chrome-wrapper.sh).

  Antialiasing is off and hinting full, so glyphs render as crisp 1-bit
  shapes in the text color. Antialiased edges are grey pixels that the e-ink
  palette can't show: dithered they speckle, snapped they make stroke widths
  uneven. Chrome ignores its own font-smoothing flags on Linux; it only
  honours fontconfig here.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
