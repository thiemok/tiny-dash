<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>tiny-dash</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
              font-family: 'Courier New', monospace;
              background: #fff;
              color: #000;
              width: {{.Width}}px;
              height: {{.Height}}px;
              overflow: hidden;
              padding: 20px;
              display: flex;
              flex-direction: column;
            }
            .header {
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              margin-bottom: 24px;
            }
            .clock {
              display: flex;
              flex-direction: column;
              gap: 8px;
            }
            .clock-hour {
              font-size: 72px;
              font-weight: bold;
              line-height: 1;
              letter-spacing: 2px;
            }
            .clock-dots {
              display: flex;
              gap: 6px;
            }
            .clock-dots .dot {
              width: 14px;
              height: 14px;
              border-radius: 50%;
              border: 2px solid #000;
              background: transparent;
            }
            .clock-dots .dot.filled {
              background: #000;
            }
            .date {
              font-size: 28px;
              text-align: right;
              padding-top: 8px;
            }
            .content {
              flex: 1;
              display: flex;
              flex-direction: column;
              gap: 16px;
            }
            .color-bar {
              display: flex;
              height: 32px;
              margin-top: auto;
              gap: 4px;
            }
            .color-bar .swatch {
              flex: 1;
              border: 1px solid #000;
            }
        </style>
        <script src="/static/htmx.min.js"></script>
    </head>
    <body>
        <div class="header">
            <div
                class="clock"
                hx-get="/dashboard/partials/clock"
                hx-trigger="every 10s"
                hx-swap="innerHTML"
            >
                {{template "clock" .}}
            </div>
            <div class="date">{{.Date}}</div>
        </div>
        <div class="content">
            <!-- widget sections will go here -->
        </div>
        <div class="color-bar">
            {{range .Swatches}}
            <div class="swatch" style="background:{{.}}"></div>
            {{end}}
        </div>
    </body>
</html>
