name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Run JS actions on Node 24 (Node 20 is being removed from the runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Job id `validate` is the stable status-check context referenced by the branch
  # ruleset (.github/rulesets/branch-main.json). Keep it in sync if renamed.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so `nx affected` can compute the base/head diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            api/go.sum
            inky/go.sum
            picoDevice/go.sum
            util/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Derives the correct base/head SHAs for `nx affected` on push and PRs.
      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      # Firmware projects (inky, picoDevice) build with TinyGo, which the
      # `firmware` job installs, so they are excluded here. Standard Go projects
      # are linted, tested, and built in full.
      - name: Lint, test, build affected
        run: pnpm nx affected -t lint test build --exclude=picoDevice,inky

      # Firmware tests run on plain host Go: TinyGo-only code (the `machine`
      # adapter) is behind a `tinygo` build tag, and picoDevice has no tests.
      - name: Test affected firmware
        run: pnpm nx affected -t test --exclude='*,!inky,!picoDevice'

  # Job id `firmware` is a required status check too (.github/rulesets/branch-main.json).
  # It compiles and tests the TinyGo targets that the host Go toolchain in
  # `validate` cannot cover: TinyGo-only stdlib gaps, `//go:build tinygo` code
  # and the picoDevice debug tag split.
  firmware:
    runs-on: ubuntu-latest
    env:
      # Keep in step with .go-version: each TinyGo release supports a fixed range
      # of Go versions.
      TINYGO_VERSION: 0.43.0
      # sha256 of tinygo${TINYGO_VERSION}.linux-amd64.tar.gz, from the release's
      # asset digest.
      TINYGO_SHA256: ca9fc6d055e3889462dea4450a2e42a92242d88b5c362a7ec39bdb563413d78a
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history so `nx affected` can compute the base/head diff.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # TinyGo drives the host Go toolchain for parsing and type checking.
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache-dependency-path: "**/go.sum"

      # Caches the release tarball (~180 MB) rather than the unpacked tree (~1.3 GB).
      - name: Cache TinyGo download
        id: tinygo-download
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/tinygo-download
          key: tinygo-download-${{ runner.os }}-${{ env.TINYGO_VERSION }}

      - name: Download TinyGo
        if: steps.tinygo-download.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/tinygo-download
          curl -fsSL -o ~/.cache/tinygo-download/tinygo.tar.gz \
            "https://github.com/tinygo-org/tinygo/releases/download/v${TINYGO_VERSION}/tinygo${TINYGO_VERSION}.linux-amd64.tar.gz"

      - name: Install TinyGo
        run: |
          echo "${TINYGO_SHA256}  $HOME/.cache/tinygo-download/tinygo.tar.gz" | sha256sum -c -
          tar -xzf ~/.cache/tinygo-download/tinygo.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tinygo/bin/tinygo" version

      # TinyGo's own build cache (compiled runtime, libc, packages); it does not
      # use GOCACHE for compiled code.
      - name: Cache TinyGo build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/tinygo
          key: tinygo-build-${{ runner.os }}-${{ env.TINYGO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: tinygo-build-${{ runner.os }}-${{ env.TINYGO_VERSION }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # go.work is gitignored, but the Nx Go plugin derives the project graph
      # from it: without it picoDevice has no dependencies and `nx affected`
      # skips it when only netkit, tinytls, inky, logkit or util change.
      - name: Create Go workspace
        run: go work init $(ls -d */go.mod | xargs -n1 dirname)

      # picoDevice:configure renders .env into internal/config/generated.go. The
      # placeholder values are enough for a compile check.
      - name: Configure picoDevice
        run: cp picoDevice/.env.example picoDevice/.env

      # Derives the correct base/head SHAs for `nx affected` on push and PRs.
      - name: Derive affected SHAs
        uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      # build:tinygo/test:tinygo cover netkit and tinytls; build covers the
      # picoDevice release firmware (plus serialstress) and the inky examples.
      - name: Build and test affected firmware
        run: >-
          pnpm nx affected -t build:tinygo test:tinygo build
          --exclude='*,!inky,!netkit,!picoDevice,!tinytls'

      - name: Build affected picoDevice debug firmware
        run: pnpm nx affected -t build -c debug --exclude='*,!picoDevice'
