name: Publish chart

# Publishes the in-repo Helm chart to GHCR as an OCI artifact
# (oci://ghcr.io/thiemok/charts/tiny-dash-api) so the cluster can deploy it.
#
# Fires when the chart changes on main, and can be run on demand. api *releases* bump the
# chart's version via a [skip ci] commit (which does not trigger this), so release.yml
# publishes the chart in that path — see its "Publish Helm chart to GHCR" step.
on:
  push:
    branches: [main]
    paths:
      - "charts/api/**"
  workflow_dispatch:

concurrency:
  group: publish-chart
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Package and push chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package charts/api --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP"/tiny-dash-api-*.tgz oci://ghcr.io/thiemok/charts
