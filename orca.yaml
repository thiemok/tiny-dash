scripts:
  setup: |
    set -euo pipefail
    cd "$ORCA_WORKTREE_PATH"

    # Gitignored local files that a fresh worktree needs from the main checkout:
    #   go.work                     - Go workspace tying api/inky/picoDevice/util together
    #   api/config.yaml             - HA/weather config (contains secrets)
    #   picoDevice/.env             - device config, rendered into generated.go by picoDevice:configure
    #   .claude/settings.local.json - local Claude Code permissions
    for f in go.work api/config.yaml picoDevice/.env .claude/settings.local.json; do
      if [ -f "$ORCA_ROOT_PATH/$f" ] && [ ! -e "$f" ]; then
        mkdir -p "$(dirname "$f")"
        cp "$ORCA_ROOT_PATH/$f" "$f"
        echo "copied $f"
      fi
    done

    # The copied go.work may predate modules added on this branch (e.g. netkit)
    # or list an older go version than the modules require.
    if [ -f go.work ]; then
      go work use $(ls -d */go.mod | xargs -n1 dirname)
    fi

    pnpm install --frozen-lockfile
